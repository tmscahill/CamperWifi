name: Feature request
description: Propose an improvement to CamperWifi
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What camper/network problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
