name: Bug report
description: Report a reproducible CamperWifi problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not post Wi-Fi passwords, tokens, private keys, or unredacted backups."
  - type: input
    id: openwrt
    attributes:
      label: OpenWrt version
      placeholder: "24.10.4"
    validations: { required: true }
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "Raspberry Pi 3B+"
    validations: { required: true }
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove passwords, tokens, public IPs, and other secrets.
