name: Release archive
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=zip --prefix="CamperWifi-${VERSION}/" -o "dist/CamperWifi-${VERSION}.zip" HEAD
          (cd dist && sha256sum "CamperWifi-${VERSION}.zip" > "CamperWifi-${VERSION}.zip.sha256")
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
